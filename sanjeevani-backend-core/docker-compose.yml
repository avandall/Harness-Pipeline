services:
  db:
    image: ankane/pgvector:latest
    container_name: sanjeevani-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanjeevani_password}
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanjeevani} -d ${POSTGRES_DB:-sanjeevani_core}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanjeevani-api
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:

